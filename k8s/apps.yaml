# Workloads for the demo. checkout is broken ON PURPOSE: it dials "db",
# but the database is only exposed as Service "orders-db".
apiVersion: apps/v1
kind: Deployment
metadata: {name: cart, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: cart}}
  template:
    metadata: {labels: {app: cart}}
    spec:
      containers:
        - name: cart
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders-db, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders-db}}
  template:
    metadata: {labels: {app: orders-db}}
    spec:
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          env:
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}   # demo only, no password in files
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: orders-db, namespace: shop}
spec:
  selector: {app: orders-db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout}}
    spec:
      terminationGracePeriodSeconds: 1     # sh ignores SIGTERM; keeps resets fast
      containers:
        - name: checkout
          image: busybox:1.36
          env:
            - {name: DB_HOST, value: db}      # <- the bug: no Service called "db"
            - {name: DB_PORT, value: "5432"}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "INFO checkout v2.4.1 starting"
              echo "INFO connecting to database at $DB_HOST:$DB_PORT"
              for try in 1 2 3; do
                if nc -z -w 2 "$DB_HOST" "$DB_PORT" 2>/dev/null; then
                  echo "INFO database connection established, serving on :8080"
                  exec sleep 86400
                fi
                echo "WARN database not reachable (attempt $try/3)"
                sleep 2
              done
              echo "ERROR failed to initialise order store"
              echo "FATAL connection refused: $DB_HOST:$DB_PORT"
              exit 1
